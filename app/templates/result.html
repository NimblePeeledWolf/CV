<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Result</title>
  </head>
  <body>
    <h2>Result</h2>

    <h3>Detections</h3>
    <ul>
      {% if detections and detections|length > 0 %}
        {% for d in detections %}
          <li>{{ d.label }} ({{ d.conf }})</li>
        {% endfor %}
      {% else %}
        <li>No detections</li>
      {% endif %}
    </ul>

    <h3>Annotated image</h3>
    <img src="{{ output_image }}" style="width: 100%; max-width: 1000px; height: auto;" />

    <p><a href="{{ url_for('home') }}">Try another</a></p>
  </body>
</html>
